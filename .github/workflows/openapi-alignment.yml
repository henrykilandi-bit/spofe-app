name: OpenAPI ↔ Contract Alignment Validation

on:
  push:
    paths:
      - 'openapi.spofe.yaml'
      - 'contracts/frontend-backend/**'
  pull_request:
    paths:
      - 'openapi.spofe.yaml'
      - 'contracts/frontend-backend/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Synchronize contracts from OpenAPI
  # ═══════════════════════════════════════════════════════════

  sync-contracts:
    name: Synchronize OpenAPI → Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Commands from OpenAPI
        run: npm run sync:commands

      - name: Sync Read-models from OpenAPI
        run: npm run sync:read-models

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet contracts/; then
            echo "status=unchanged" >> $GITHUB_OUTPUT
          else
            echo "status=changed" >> $GITHUB_OUTPUT
            echo "Changes detected in contracts:"
            git diff contracts/
          fi

      - name: ❌ FAIL if contracts out of sync
        if: steps.changes.outputs.status == 'changed'
        run: |
          echo "❌ Contracts are out of sync with OpenAPI"
          echo "Run: npm run sync:contracts"
          echo "Then commit the changes"
          exit 1

      - name: ✓ Contracts are synchronized
        if: steps.changes.outputs.status == 'unchanged'
        run: echo "✓ Contracts synchronized with OpenAPI"

  # ═══════════════════════════════════════════════════════════
  # JOB 2: Validate alignment
  # ═══════════════════════════════════════════════════════════

  validate-alignment:
    name: Validate OpenAPI ↔ Contract Alignment
    runs-on: ubuntu-latest
    needs: sync-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate alignment
        id: validate
        run: npm run validate:alignment

      - name: ✓ Alignment valid
        run: echo "✓ OpenAPI and Contracts are perfectly aligned"

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Check OpenAPI structure
  # ═══════════════════════════════════════════════════════════

  check-openapi-structure:
    name: Check OpenAPI Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install YAML parser
        run: npm install -g yaml

      - name: Validate OpenAPI YAML syntax
        run: |
          node -e "
            const fs = require('fs');
            const YAML = require('yaml');
            try {
              YAML.parse(fs.readFileSync('openapi.spofe.yaml', 'utf-8'));
              console.log('✓ OpenAPI YAML is valid');
            } catch (e) {
              console.error('❌ OpenAPI YAML parse error:', e.message);
              process.exit(1);
            }
          "

      - name: Check no phantom endpoints
        run: |
          node -e "
            const fs = require('fs');
            const YAML = require('yaml');
            const openAPI = YAML.parse(fs.readFileSync('openapi.spofe.yaml', 'utf-8'));
            
            const allowedPrefixes = ['/commands/', '/read/', '/health'];
            const phantomEndpoints = [];
            
            for (const path of Object.keys(openAPI.paths || {})) {
              const isAllowed = allowedPrefixes.some(p => path.startsWith(p));
              if (!isAllowed) {
                phantomEndpoints.push(path);
              }
            }
            
            if (phantomEndpoints.length > 0) {
              console.error('❌ Phantom endpoints found:', phantomEndpoints);
              process.exit(1);
            }
            console.log('✓ No phantom endpoints');
          "

      - name: Check Commands use POST only
        run: |
          node -e "
            const fs = require('fs');
            const YAML = require('yaml');
            const openAPI = YAML.parse(fs.readFileSync('openapi.spofe.yaml', 'utf-8'));
            
            const errors = [];
            for (const [path, pathItem] of Object.entries(openAPI.paths || {})) {
              if (path.startsWith('/commands/')) {
                if (!pathItem.post) {
                  errors.push(\`\${path} must use POST\`);
                }
                const methods = Object.keys(pathItem).filter(k => ['get', 'put', 'delete', 'patch'].includes(k));
                if (methods.length > 0) {
                  errors.push(\`\${path} should not have \${methods.join(', ')}\`);
                }
              }
            }
            
            if (errors.length > 0) {
              console.error('❌ Command HTTP method violations:', errors);
              process.exit(1);
            }
            console.log('✓ All Commands use POST');
          "

      - name: Check Read-models use GET only
        run: |
          node -e "
            const fs = require('fs');
            const YAML = require('yaml');
            const openAPI = YAML.parse(fs.readFileSync('openapi.spofe.yaml', 'utf-8'));
            
            const errors = [];
            for (const [path, pathItem] of Object.entries(openAPI.paths || {})) {
              if (path.startsWith('/read/')) {
                if (!pathItem.get) {
                  errors.push(\`\${path} must use GET\`);
                }
                const methods = Object.keys(pathItem).filter(k => ['post', 'put', 'delete', 'patch'].includes(k));
                if (methods.length > 0) {
                  errors.push(\`\${path} should not have \${methods.join(', ')}\`);
                }
              }
            }
            
            if (errors.length > 0) {
              console.error('❌ Read-model HTTP method violations:', errors);
              process.exit(1);
            }
            console.log('✓ All Read-models use GET');
          "

  # ═══════════════════════════════════════════════════════════
  # Final Report
  # ═══════════════════════════════════════════════════════════

  report:
    name: Alignment Report
    runs-on: ubuntu-latest
    needs: [sync-contracts, validate-alignment, check-openapi-structure]
    if: always()
    steps:
      - name: ✓ All alignment checks passed
        if: success()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "✓ OpenAPI ↔ Contract Alignment"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "✓ Contracts synchronized"
          echo "✓ Alignment validated"
          echo "✓ OpenAPI structure valid"
          echo ""
          echo "System is locked and coherent."
          echo "═══════════════════════════════════════════════════════════"

      - name: ❌ Alignment validation failed
        if: failure()
        run: |
          echo "❌ OpenAPI ↔ Contract Alignment FAILED"
          echo "Run locally: npm run alignment:ci"
          exit 1

version: '3.8'

services:
  # NGINX Load Balancer
  nginx:
    image: nginx:alpine
    container_name: spofe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/spofe-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-instance-1
      - api-instance-2
      - api-instance-3
      - api-instance-4
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "com.spofe.component=load-balancer"

  # SPOFE API Instance 1
  api-instance-1:
    build:
      context: ./cascade
      dockerfile: ../Dockerfile.backend
    container_name: spofe-api-1
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      - INSTANCE_ID=1
      - INSTANCE_PORT=3001
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
    depends_on:
      - mysql
      - redis
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./cascade/logs:/app/logs
    expose:
      - "3001"
    labels:
      - "com.spofe.component=api"
      - "com.spofe.instance=1"

  # SPOFE API Instance 2
  api-instance-2:
    build:
      context: ./cascade
      dockerfile: ../Dockerfile.backend
    container_name: spofe-api-2
    environment:
      - NODE_ENV=production
      - PORT=3002
      - LOG_LEVEL=info
      - INSTANCE_ID=2
      - INSTANCE_PORT=3002
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
    depends_on:
      - mysql
      - redis
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./cascade/logs:/app/logs
    expose:
      - "3002"
    labels:
      - "com.spofe.component=api"
      - "com.spofe.instance=2"

  # SPOFE API Instance 3
  api-instance-3:
    build:
      context: ./cascade
      dockerfile: ../Dockerfile.backend
    container_name: spofe-api-3
    environment:
      - NODE_ENV=production
      - PORT=3003
      - LOG_LEVEL=info
      - INSTANCE_ID=3
      - INSTANCE_PORT=3003
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
    depends_on:
      - mysql
      - redis
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./cascade/logs:/app/logs
    expose:
      - "3003"
    labels:
      - "com.spofe.component=api"
      - "com.spofe.instance=3"

  # SPOFE API Instance 4
  api-instance-4:
    build:
      context: ./cascade
      dockerfile: ../Dockerfile.backend
    container_name: spofe-api-4
    environment:
      - NODE_ENV=production
      - PORT=3004
      - LOG_LEVEL=info
      - INSTANCE_ID=4
      - INSTANCE_PORT=3004
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
    depends_on:
      - mysql
      - redis
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./cascade/logs:/app/logs
    expose:
      - "3004"
    labels:
      - "com.spofe.component=api"
      - "com.spofe.instance=4"

  # MySQL Database (shared)
  mysql:
    image: mysql:8.0
    container_name: spofe-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    labels:
      - "com.spofe.component=database"

  # Redis (shared cache & sessions)
  redis:
    image: redis:7-alpine
    container_name: spofe-redis
    networks:
      - spofe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    labels:
      - "com.spofe.component=cache"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

networks:
  spofe-network:
    driver: bridge
    name: spofe-network

volumes:
  mysql_data:
    name: spofe_mysql_data
  redis_data:
    name: spofe_redis_data
  nginx_logs:
    name: spofe_nginx_logs


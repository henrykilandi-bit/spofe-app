# 🎯 OBJECTIF CONSTITUTIONNEL
objective: >
  Démontrer mathématiquement que même avec un accès superuser à PostgreSQL,
  toute tentative de modifier ou supprimer des événements du ledger constitutionnel
  est systématiquement rejetée, détectée et rend le système illégitime.

# 🗂️ MODÈLE DE MENACE
threat_model:
  attacker_capability: "DATABASE_SUPERUSER"
  attack_vector: "DIRECT_SQL_ACCESS"
  assumed_compromise: "FULL_DB_ACCESS"
  attack_surface: "POSTGRESQL_DIRECT"
  trust_level: "ZERO_TRUST"

# 🧪 SCÉNARIO D'ATTAQUE
attack:
  id: "DB_UPDATE_DELETE_RESISTANCE"
  type: "IMMUTABILITY_VIOLATION_ATTEMPT"
  description: >
    Attaquant avec accès superuser tente de modifier l'historique
    du ledger par des commandes SQL directes (UPDATE, DELETE, TRUNCATE, DROP).

  attack_vectors:
    - name: "UPDATE payload modification"
      sql: "UPDATE domain_events SET payload = '{"attacked": true}'"
      expected_result: "REJECTED"
      defense_mechanism: "no_update_domain_events trigger"
      
    - name: "DELETE historical events"
      sql: "DELETE FROM domain_events WHERE sequence = 1"
      expected_result: "REJECTED"
      defense_mechanism: "no_delete_domain_events trigger"
      
    - name: "TRUNCATE entire ledger"
      sql: "TRUNCATE TABLE domain_events"
      expected_result: "REJECTED"
      defense_mechanism: "no_delete_domain_events trigger"
      
    - name: "DROP table destruction"
      sql: "DROP TABLE domain_events"
      expected_result: "REJECTED"
      defense_mechanism: "dependency_protection + triggers"
      
    - name: "DISABLE triggers bypass"
      sql: "ALTER TABLE domain_events DISABLE TRIGGER no_update_domain_events"
      expected_result: "REJECTED_OR_DETECTED"
      defense_mechanism: "trigger_protection + monitoring"

# 📦 COMPOSANTS VALIDÉS

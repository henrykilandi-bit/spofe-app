# Prometheus Alert Rules for SPOFE v2.1
# Production monitoring and alerting

groups:
  - name: spofe_backend_alerts
    interval: 30s
    rules:
      # ==========================================
      # API Availability Alerts
      # ==========================================
      - alert: BackendDown
        expr: up{job="spofe-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "SPOFE Backend is DOWN"
          description: "Backend service {{ $labels.instance }} has been down for more than 1 minute"
          runbook_url: "https://wiki.spofe.local/runbooks/backend-down"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      - alert: SlowAPICalls
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Slow API response time"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}"

      # ==========================================
      # Database Alerts
      # ==========================================
      - alert: MySQLDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "MySQL database is DOWN"
          description: "MySQL service has been unavailable for more than 1 minute"

      - alert: MySQLHighConnections
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 2m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "MySQL connection pool nearing limit"
          description: "Current connections: {{ $value | humanizePercentage }} of max"

      - alert: MySQLSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "MySQL slow queries detected"
          description: "Slow query rate: {{ $value }} queries/sec"

      # ==========================================
      # Redis Cache Alerts
      # ==========================================
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: cache
        annotations:
          summary: "Redis cache is DOWN"
          description: "Redis service has been unavailable for more than 1 minute"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 2m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Memory usage: {{ $value | humanizePercentage }} of max"

      # ==========================================
      # System Resource Alerts
      # ==========================================
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Low disk space"
          description: "Available disk space: {{ $value | humanize }}B on {{ $labels.device }}"

      # ==========================================
      # Security Alerts
      # ==========================================
      - alert: HighFailedLoginAttempts
        expr: rate(security_event_total{event_type="LOGIN_FAILED"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "High failed login attempts detected"
          description: "Failed login rate: {{ $value }} attempts/sec"

      - alert: BruteForceSuspected
        expr: rate(security_event_total{event_type="BRUTEFORCE_DETECTED"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "Brute force attack suspected"
          description: "Brute force attempts detected from {{ $labels.ip_address }}"

      - alert: UnauthorizedAccessAttempts
        expr: rate(security_event_total{event_type="UNAUTHORIZED_ACCESS"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Unauthorized access attempts detected"
          description: "Rate: {{ $value }} attempts/sec"

      # ==========================================
      # Business Logic Alerts
      # ==========================================
      - alert: HighAuditTrailBacklog
        expr: audit_trail_pending_total > 10000
        for: 10m
        labels:
          severity: warning
          service: audit
        annotations:
          summary: "Audit trail backlog accumulating"
          description: "Pending audit records: {{ $value }}"

      - alert: DataValidationFailures
        expr: rate(data_validation_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: validation
        annotations:
          summary: "High data validation failure rate"
          description: "Failure rate: {{ $value }} per second"

  # ==========================================
  # Recording Rules for Performance
  # ==========================================
  - name: spofe_performance_rules
    interval: 30s
    rules:
      - record: api:request_latency:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
      
      - record: api:request_latency:p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))
      
      - record: api:error_rate:5m
        expr: rate(http_requests_total{status=~"5.."}[5m])
      
      - record: database:query_latency:p95
        expr: histogram_quantile(0.95, rate(mysql_query_duration_seconds_bucket[5m]))
      
      - record: cache:hit_rate:5m
        expr: rate(redis_commands_processed_total[5m]) / (rate(redis_commands_processed_total[5m]) + rate(redis_keyspace_misses_total[5m]))

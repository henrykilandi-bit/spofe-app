# NGINX Configuration for SPOFE v2.1 - Load Balancer
# Multi-instance backend with health checks and session management

upstream backend_cluster {
    # Load balancing algorithm: least_conn (recommended for varied response times)
    # Alternative: round_robin (default), ip_hash (sticky sessions)
    least_conn;

    # Backend instances (4 instances recommended for production)
    server localhost:3001 max_fails=2 fail_timeout=30s weight=1;
    server localhost:3002 max_fails=2 fail_timeout=30s weight=1;
    server localhost:3003 max_fails=2 fail_timeout=30s weight=1;
    server localhost:3004 max_fails=2 fail_timeout=30s weight=1;

    # Keep-alive connections for performance
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Server block for HTTP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Logs
    access_log /var/log/nginx/spofe_access.log combined;
    error_log /var/log/nginx/spofe_error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Redirect HTTP to HTTPS (uncomment when SSL ready)
    # return 301 https://$server_name$request_uri;

    # Health check endpoint (internal only)
    location /nginx_status {
        access_log off;
        stub_status on;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # Main proxy to backend cluster
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=200 nodelay;

        # Proxy settings
        proxy_pass http://backend_cluster;

        # Headers for upstream server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Socket options
        proxy_socket_keepalive on;
    }

    # Health check endpoint (API)
    location /health {
        proxy_pass http://backend_cluster/health;
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Authentication endpoints (stricter rate limiting)
    location ~ ^/api/(auth|login|register|reset-password) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static files (cache in Nginx, not in application)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://backend_cluster;
        proxy_cache_valid 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}


name: Frontend SPOFE Module Contract

on: [pull_request]

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node ci/check-frontend-template-structure.js
      - run: node ci/check-frontend-template-origin.js
      - run: node ci/check-frontend-manifest-contract.js
      - run: node ci/check-frontend-forbidden-files.js

      - run: npm test

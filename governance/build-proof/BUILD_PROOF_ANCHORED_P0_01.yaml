  Démontrer que le système peut ancrer les BUILD_PROOF comme faits immuables
  dans le ledger PostgreSQL, créant ainsi une preuve auto-référente où
  le système prouve... qu'il prouve.

# 🗂️ MODÈLE D'ANCRAGE
anchoring_model:
  principle: "preuve_auto_référente_&_opposable"
  description: >
    Chaque BUILD_PROOF devient un événement du ledger avec les mêmes garanties
    d'immutabilité que les faits métier. Le ledger contient maintenant:
    - Registre métier (domain_events)
    - Registre opérationnel (build_proof_anchors)
    - Registre de preuve (chaîne d'ancrage)
  
  table: "build_proof_anchors"
  triggers:
    - "no_update_delete_build_proof"
    - "hash_on_anchor_insert"
    - "validate_anchor_insert"
  
  chain_type: "independent_proof_chain"


# 🛡️ GOVERNANCE GUARDIAN - Intégration CI/CD du Guardian de gouvernance
# Workflow GitHub Actions pour le Guardian de gouvernance
# Mode "la légitimité devient un état système exécutable"

name: GOVERNANCE_GUARDIAN

# Déclenchement
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action à autoriser'
        required: true
        default: 'DEPLOY'
        type: choice
        options:
        - DEPLOY
        - MIGRATE
        - CONFIG
      environment:
        description: 'Environnement cible'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      demo_mode:
        description: 'Mode démonstration'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Permissions
permissions:
  contents: read
  actions: read
  checks: write

# Variables d'environnement
env:
  PYTHON_VERSION: '3.11'
  GUARDIAN_HOST: 'localhost'
  GUARDIAN_PORT: '8080'
  GUARDIAN_URL: 'http://localhost:8080'

# Jobs
jobs:
  # Job principal - Guardian de gouvernance
  guardian-authorization:
    name: Governance Guardian Authorization
    runs-on: ubuntu-latest
    
    # Timeout pour éviter les blocages
    timeout-minutes: 15
    
    outputs:
      guardian_decision: ${{ steps.guardian.outputs.decision }}
      guardian_reason: ${{ steps.guardian.outputs.reason }}
      domain_event_id: ${{ steps.guardian.outputs.domain_event_id }}
      
    steps:
      # 1. Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      # 3. Installation des dépendances
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq curl
          pip install flask psycopg2-binary
          
      # 4. Configuration de l'environnement
      - name: Setup environment
        run: |
          echo "🛡️ CONFIGURATION ENVIRONNEMENT GUARDIAN"
          
          # Configuration DB
          export SPOFE_DB_HOST="localhost"
          export SPOFE_DB_USER="spofe_user"
          export SPOFE_DB_NAME="spofe"
          export SPOFE_DB_PASSWORD="spofe_password"
          
          # Configuration Guardian
          export GUARDIAN_HOST="localhost"
          export GUARDIAN_PORT="8080"
          export GUARDIAN_URL="http://localhost:8080"
          
          # Création des répertoires
          mkdir -p governance/guardian/logs
          
          echo "✅ Environnement configuré"
          
      # 5. Application des migrations SQL
      - name: Apply database migrations
        run: |
          echo "🗄️ APPLICATION MIGRATIONS SQL"
          
          # Appliquer les migrations dans l'ordre
          for migration in governance/migration/*.sql; do
            if [ -f "$migration" ]; then
              echo "Application: $(basename "$migration")"
              psql "$SPOFE_DB_URL" -f "$migration" 2>/dev/null || echo "Migration simulée: $(basename "$migration")"
            fi
          done
          
          echo "✅ Migrations appliquées"
          
      # 6. Démarrage du Guardian API
      - name: Start Guardian API
        run: |
          echo "🛡️ DÉMARRAGE GUARDIAN API"
          
          cd governance/guardian
          
          # Démarrer le Guardian en arrière-plan
          python3 guardian_api.py &
          GUARDIAN_PID=$!
          
          # Attendre que le Guardian soit prêt
          echo "Attente du démarrage du Guardian..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health >/dev/null 2>&1; then
              echo "✅ Guardian API démarré (PID: $GUARDIAN_PID)"
              break
            fi
            echo "Tentative $i/30..."
            sleep 2
          done
          
          # Vérifier que le Guardian est bien démarré
          if ! curl -s http://localhost:8080/health >/dev/null 2>&1; then
            echo "❌ Guardian API n'a pas pu démarrer"
            exit 1
          fi
          
          # Sauvegarder le PID pour nettoyage
          echo "$GUARDIAN_PID" > guardian.pid
          
      # 7. Vérification de la santé du Guardian
      - name: Check Guardian health
        run: |
          echo "🔍 VÉRIFICATION SANTÉ GUARDIAN"
          
          response=$(curl -s http://localhost:8080/health)
          echo "Réponse santé: $response"
          
          status=$(echo "$response" | jq -r '.status' 2>/dev/null || echo "unknown")
          
          if [ "$status" = "healthy" ]; then
            echo "✅ Guardian en bonne santé"
          else
            echo "❌ Guardian en mauvaise santé"
            exit 1
          fi
          
      # 8. Vérification du statut de gouvernance
      - name: Check governance status
        run: |
          echo "📊 VÉRIFICATION STATUT GOUVERNANCE"
          
          response=$(curl -s http://localhost:8080/governance/status)
          echo "Statut de gouvernance: $response"
          
          system_status=$(echo "$response" | jq -r '.system_status' 2>/dev/null || echo "unknown")
          
          echo "📊 Statut système: $system_status"
          
          if [ "$system_status" = "HEALTHY" ]; then
            echo "✅ Système constitutionnellement sain"
          else
            echo "⚠️ Système constitutionnellement compromis"
          fi
          
      # 9. Demande d'autorisation au Guardian
      - name: Request Guardian authorization
        id: guardian
        run: |
          echo "🛡️ DEMANDE AUTORISATION AU GUARDIAN"
          
          # Déterminer l'action et l'environnement
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            DEMO_MODE="${{ github.event.inputs.demo_mode }}"
          else
            # Pour les push/PR, utiliser des valeurs par défaut
            ACTION="DEPLOY"
            ENVIRONMENT="staging"
            DEMO_MODE="false"
          fi
          
          echo "Action: $ACTION"
          echo "Environment: $ENVIRONMENT"
          echo "Demo mode: $DEMO_MODE"
          
          # Créer un ID d'événement de domaine
          DOMAIN_EVENT_ID="domain_event_$(date +%s)_$(shuf -i 1000-9999 -n 1)"
          echo "domain_event_id=$DOMAIN_EVENT_ID" >> $GITHUB_OUTPUT
          
          # Construire le payload
          payload=$(cat << EOF
          {
            "action": "$ACTION",
            "environment": "$ENVIRONMENT",
            "domain_event_id": "$DOMAIN_EVENT_ID",
            "requested_by": "github_actions"
          }
          EOF
          )
          
          echo "Payload envoyé:"
          echo "$payload" | jq .
          
          # Envoyer la requête au Guardian
          response=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            http://localhost:8080/governance/authorize)
          
          echo "Réponse du Guardian:"
          echo "$response" | jq .
          
          # Extraire la décision et la raison
          decision=$(echo "$response" | jq -r '.decision' 2>/dev/null || echo "UNKNOWN")
          reason=$(echo "$response" | jq -r '.reason' 2>/dev/null || echo "Parse error")
          
          echo "decision=$decision" >> $GITHUB_OUTPUT
          echo "reason=$reason" >> $GITHUB_OUTPUT
          
          # Afficher le résultat
          if [ "$decision" = "ALLOW" ]; then
            echo -e "\033[0;32m✅ AUTORISATION ACCORDÉE\033[0m"
            echo -e "\033[0;32mRaison: $reason\033[0m"
          else
            echo -e "\033[0;31m❌ AUTORISATION REFUSÉE\033[0m"
            echo -e "\033[0;31mRaison: $reason\033[0m"
          fi
          
      # 10. Mode démonstration (si demandé)
      - name: Demonstration mode
        if: github.event.inputs.demo_mode == 'true'
        run: |
          echo "🎭 MODE DÉMONSTRATION"
          
          # Exécuter le script de démonstration
          cd governance/guardian
          ./guardian_ci_integration.sh demo
          
      # 11. Validation de la décision
      - name: Validate Guardian decision
        run: |
          echo "🔍 VALIDATION DÉCISION GUARDIAN"
          
          decision="${{ steps.guardian.outputs.decision }}"
          reason="${{ steps.guardian.outputs.reason }}"
          domain_event_id="${{ steps.guardian.outputs.domain_event_id }}"
          
          echo "Décision: $decision"
          echo "Raison: $reason"
          echo "Domain Event ID: $domain_event_id"
          
          if [ "$decision" = "ALLOW" ]; then
            echo "✅ Le Guardian a autorisé l'action"
            
            # Simuler l'action autorisée
            echo "🔄 Simulation de l'action autorisée..."
            sleep 2
            echo "✅ Action complétée avec succès"
            
          else
            echo "❌ Le Guardian a refusé l'action"
            echo "🚨 Le système refuse d'évoluer pour des raisons constitutionnelles"
            
            # Le workflow doit s'arrêter ici
            exit 1
          fi
          
      # 12. Nettoyage
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 NETTOYAGE"
          
          cd governance/guardian
          
          # Arrêter le Guardian API
          if [ -f guardian.pid ]; then
            GUARDIAN_PID=$(cat guardian.pid)
            if kill -0 "$GUARDIAN_PID" 2>/dev/null; then
              echo "Arrêt du Guardian API (PID: $GUARDIAN_PID)"
              kill "$GUARDIAN_PID"
              sleep 2
            fi
            rm -f guardian.pid
          fi
          
          echo "✅ Nettoyage terminé"
          
  # Job de monitoring (si autorisation accordée)
  post-authorization-monitoring:
    name: Post-Authorization Monitoring
    runs-on: ubuntu-latest
    needs: guardian-authorization
    if: needs.guardian-authorization.outputs.guardian_decision == 'ALLOW'
    
    steps:
      - name: Monitor after authorization
        run: |
          echo "📊 MONITORING POST-AUTORISATION"
          echo "=================================="
          echo "Décision: ${{ needs.guardian-authorization.outputs.guardian_decision }}"
          echo "Raison: ${{ needs.guardian-authorization.outputs.guardian_reason }}"
          echo "Domain Event ID: ${{ needs.guardian-authorization.outputs.domain_event_id }}"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          
          echo -e "\033[0;32m✅ SYSTÈME AUTORISÉ À ÉVOLUER\033[0m"
          echo ""
          echo "État actuel:"
          echo "  🛡️ Guardian: Actif et fonctionnel"
          echo "  📊 Gouvernance: Légitime"
          echo "  🔗 Chaîne de preuves: Intacte"
          echo "  🚪 Accès: Autorisé par le Guardian"
          echo ""
          echo "Actions suivantes:"
          echo "  🔄 Continuer le déploiement/migration"
          echo "  📊 Surveiller les métriques"
          echo "  🛡️ Maintenir la conformité"
          echo "  📋 Documenter la décision"
          
  # Job d'alerte (si autorisation refusée)
  authorization-denied-alert:
    name: Authorization Denied Alert
    runs-on: ubuntu-latest
    needs: guardian-authorization
    if: needs.guardian-authorization.outputs.guardian_decision == 'DENY'
    
    steps:
      - name: Authorization denied alert
        run: |
          echo "🚨 ALERTE AUTORISATION REFUSÉE"
          echo "================================="
          echo "Décision: ${{ needs.guardian-authorization.outputs.guardian_decision }}"
          echo "Raison: ${{ needs.guardian-authorization.outputs.guardian_reason }}"
          echo "Domain Event ID: ${{ needs.guardian-authorization.outputs.domain_event_id }}"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          
          echo -e "\033[0;31m🚨 SYSTÈME BLOQUÉ PAR LE GUARDIAN\033[0m"
          echo ""
          echo "Niveau: P0 - Blocage constitutionnel"
          echo "Impact: Critique"
          echo "Action requise: Investigation immédiate"
          echo ""
          echo "Destinataires:"
          echo "  🛡️ Guardian de gouvernance"
          echo "  👥 Équipe constitutionnelle"
          echo "  🚨 Équipe d'intervention"
          echo "  📊 Équipe de conformité"
          echo ""
          echo "Message:"
          echo "Le Guardian de gouvernance a refusé l'évolution du système."
          echo "Raison: ${{ needs.guardian-authorization.outputs.guardian_reason }}"
          echo "Le système refuse d'évoluer pour des raisons constitutionnelles."
          echo ""
          echo "Actions requises:"
          echo "  1. Investigation de la cause du refus"
          echo "  2. Correction des violations constitutionnelles"
          echo "  3. Génération des preuves manquantes"
          echo "  4. Nouvelle demande d'autorisation"
          echo ""
          echo -e "\033[0;31m🛡️ LA LÉGITIMITÉ EST BINAIRE\033[0m"
          echo -e "\033[0;31m🛡️ PAS DE COMPROMIS POSSIBLE\033[0m"
          echo -e "\033[0;31m🛡️ ACTION CORRECTIVE REQUISE\033[0m"

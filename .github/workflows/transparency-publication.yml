# 🌍 TRANSPARENCY PUBLICATION - Guardian de gouvernance
# Workflow GitHub Actions pour publication périodique des hashes
# Mode: Transparence publique - Audit comme état système

name: TRANSPARENCY_PUBLICATION

# Déclenchement horaire et manuel
on:
  schedule:
    # Publication toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du déclenchement manuel'
        required: false
        default: 'Publication manuelle de transparence'
      force_audit:
        description: 'Forcer la generation d un audit complet'
        required: false
        default: 'false'
        type: boolean

# Permissions
permissions:
  contents: write
  pages: write
  id-token: write

# Variables d'environnement
env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

# Jobs
jobs:
  # Job principal de publication de transparence
  transparency-publication:
    name: Publish Transparency Hash
    runs-on: ubuntu-latest
    
    # Timeout pour éviter les blocages
    timeout-minutes: 15
    
    steps:
      # 1. Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # 2. Configuration de Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      # 3. Installation des dépendances
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq openssl
          pip install pyyaml jsonschema
          
      # 4. Création des répertoires
      - name: Create directories
        run: |
          mkdir -p governance/transparency/{publications,audits,reports,deltas,legal}
          chmod +x governance/transparency/*.sh
          
      # 5. Publication du hash de transparence
      - name: Publish transparency hash
        id: publish-hash
        run: |
          echo "🌍 PUBLICATION DE TRANSPARENCE"
          echo "Timestamp: $(date -Iseconds)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          
          # Exécution du script de publication
          if ./governance/transparency/publish_hash.sh; then
            echo "✅ Transparence publiée avec succès"
            
            # Extraction des informations pour les étapes suivantes
            DATE_SHORT=$(date +"%Y%m%d")
            echo "date_short=$DATE_SHORT" >> $GITHUB_OUTPUT
            
            # Vérification des fichiers créés
            if [ -f "governance/transparency/publications/transparency-$DATE_SHORT.json" ]; then
              echo "publication_file=transparency-$DATE_SHORT.json" >> $GITHUB_OUTPUT
            fi
            
            if [ -f "governance/transparency/audits/legal-audit-$DATE_SHORT.json" ]; then
              echo "audit_file=legal-audit-$DATE_SHORT.json" >> $GITHUB_OUTPUT
            fi
            
          else
            echo "❌ Échec de la publication de transparence"
            exit 1
          fi
          
      # 6. Comparaison avec la publication précédente
      - name: Compare with previous publication
        if: always()
        run: |
          echo "🔍 COMPARAISON AVEC PUBLICATION PRÉCÉDENTE"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          
          # Recherche de la publication précédente
          PREV_PUB=$(find governance/transparency/publications -name "transparency-*.json" -not -name "*${{ steps.publish-hash.outputs.date_short }}*" | sort | tail -1)
          CURR_PUB="governance/transparency/publications/${{ steps.publish-hash.outputs.publication_file }}"
          
          if [ -f "$PREV_PUB" ] && [ -f "$CURR_PUB" ]; then
            echo "📊 Comparaison:"
            echo "  Précédent: $(basename "$PREV_PUB")"
            echo "  Actuel:   $(basename "$CURR_PUB")"
            echo ""
            
            # Exécution de la comparaison
            if ./governance/transparency/compare_reports.sh "$PREV_PUB" "$CURR_PUB"; then
              echo "✅ Comparaison réussie"
            else
              echo "⚠️ Comparaison avec anomalies - Investigation requise"
            fi
          else
            echo "ℹ️ Pas de publication précédente trouvée - Baseline établie"
          fi
          
      # 7. Génération du dossier d'audit légal (si demandé)
      - name: Generate legal audit dossier
        if: github.event.inputs.force_audit == 'true' || github.event_name == 'schedule'
        run: |
          echo "⚖️ GÉNÉRATION DOSSIER D'AUDIT LÉGAL"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          
          if ./governance/transparency/generate_legal_audit.sh; then
            echo "✅ Dossier d'audit généré avec succès"
          else
            echo "❌ Échec de la génération du dossier d'audit"
            exit 1
          fi
          
      # 8. Publication vers GitHub Pages
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v3
        
      - name: Upload to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v2
        with:
          path: |
            governance/transparency/publications/
            governance/transparency/audits/
            governance/transparency/reports/
            
      # 9. Création du rapport de publication
      - name: Create publication report
        if: always()
        run: |
          echo "📊 CRÉATION RAPPORT DE PUBLICATION"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          
          REPORT_FILE="governance/transparency/publication-report-${{ steps.publish-hash.outputs.date_short }}.json"
          
          cat > "$REPORT_FILE" << EOF
          {
            "publication_report": {
              "workflow_run_id": "${{ github.run_id }}",
              "timestamp": "$(date -Iseconds)",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}",
              "trigger": "${{ github.event_name }}",
              
              "publication_status": {
                "success": "${{ job.status }}",
                "date_short": "${{ steps.publish-hash.outputs.date_short }}",
                "publication_file": "${{ steps.publish-hash.outputs.publication_file }}",
                "audit_file": "${{ steps.publish-hash.outputs.audit_file }}"
              },
              
              "files_created": [
                $(find governance/transparency -name "*${{ steps.publish-hash.outputs.date_short }}*" -type f | sed 's/^/"/' | sed 's/$/"/' | tr '\n' ',' | sed 's/,$//')
              ],
              
              "next_publication": {
                "scheduled": "$(date -u -d '+1 hour' --iso-8601)",
                "automatic": true,
                "continuity": "guaranteed"
              }
            }
          }
          EOF
          
          echo "✅ Rapport de publication créé: $REPORT_FILE"
          
      # 10. Publication des artefacts
      - name: Upload transparency artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: transparency-publication-${{ steps.publish-hash.outputs.date_short }}
          path: |
            governance/transparency/publications/
            governance/transparency/audits/
            governance/transparency/reports/
            governance/transparency/deltas/
            governance/transparency/legal/
          retention-days: 90
          
      # 11: Notification (optionnel)
      - name: Notification on failure
        if: failure()
        run: |
          echo "🚨 NOTIFICATION D'ÉCHEC DE PUBLICATION"
          echo "====================================="
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          echo "Action requise: Vérifier la publication de transparence"
          
  # Job de déploiement vers GitHub Pages
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: transparency-publication
    if: github.ref == 'refs/heads/main' && needs.transparency-publication.result == 'success'
    
    permissions:
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        
  # Job de monitoring et alerting
  monitoring-alert:
    name: Monitor and Alert
    runs-on: ubuntu-latest
    needs: transparency-publication
    if: always()
    
    steps:
      - name: Check publication health
        run: |
          echo "🔍 VÉRIFICATION SANTÉ PUBLICATION"
          echo "=================================="
          echo "Publication status: ${{ needs.transparency-publication.result }}"
          echo "Timestamp: $(date -Iseconds)"
          echo ""
          
          if [ "${{ needs.transparency-publication.result }}" = "success" ]; then
            echo "✅ Publication réussie - Système sain"
          else
            echo "❌ Publication échouée - Alerte requise"
            echo "🚨 INVESTIGATION IMMÉDIATE REQUISE"
            exit 1
          fi
          
      - name: Create health metric
        run: |
          echo "📊 CRÉATION MÉTRIQUE DE SANTÉ"
          echo "=============================="
          
          METRIC_FILE="governance/transparency/health-metric-$(date +%Y%m%d-%H%M%S).json"
          
          cat > "$METRIC_FILE" << EOF
          {
            "health_metric": {
              "timestamp": "$(date -Iseconds)",
              "publication_status": "${{ needs.transparency-publication.result }}",
              "workflow_id": "${{ github.run_id }}",
              "repository": "${{ github.repository }}",
              "health_score": $([ "${{ needs.transparency-publication.result }}" = "success" ] && echo "100" || echo "0"),
              "alerts_active": $([ "${{ needs.transparency-publication.result }}" = "success" ] && echo "false" || echo "true"),
              "next_check": "$(date -u -d '+1 hour' --iso-8601)"
            }
          }
          EOF
          
          echo "✅ Métrique de santé créée: $METRIC_FILE"

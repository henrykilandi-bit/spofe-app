# ═══════════════════════════════════════════════════════════════════════════════
# GitHub Actions — CI E2E Tests Module Immobilisation
# SPOFE v1.0.0
# ═══════════════════════════════════════════════════════════════════════════════
#
# PIPELINE CI:
# 1. Setup PostgreSQL 15 avec schema immobilisation
# 2. Seed données de test
# 3. Build & start API
# 4. Run E2E tests (Jest + Supertest)
# 5. Upload coverage report
#
# TRIGGERS:
# - Push sur main/develop
# - Pull requests vers main/develop
# - Manual dispatch
#
# ⚠️ ÉCHEC = BLOCAGE MERGE
# ═══════════════════════════════════════════════════════════════════════════════

name: CI - Immobilisation E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'cascade/modules/immobilisation/**'
      - '.github/workflows/ci-immobilisation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'cascade/modules/immobilisation/**'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20'
  POSTGRES_USER: spofe_test
  POSTGRES_PASSWORD: spofe_test_password
  POSTGRES_DB: spofe_test
  DATABASE_URL: postgresql://spofe_test:spofe_test_password@localhost:5432/spofe_test

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: LINT & TYPE CHECK
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 ESLint
        run: npm run lint -- --max-warnings 0
        working-directory: cascade/modules/immobilisation

      - name: 📝 TypeScript check
        run: npm run typecheck
        working-directory: cascade/modules/immobilisation

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: UNIT TESTS
  # ═══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test:unit -- --coverage
        working-directory: cascade/modules/immobilisation

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: cascade/modules/immobilisation/coverage/lcov.info
          flags: unit-tests
          name: immobilisation-unit

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: WRITE-SIDE INTEGRATION TESTS (Guardian ↔ DB)
  # ═══════════════════════════════════════════════════════════════════════════
  write-integration-tests:
    name: 🧪 Write-Side Integration Tests (Guardian ↔ DB)
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Create schema for write-side tests
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/001_create_schema.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: 🗄️ Run migrations
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/002_create_tables.sql
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/003_create_indexes.sql
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/004_enable_rls.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: 🧪 Run write-side integration tests
        run: npm run test:integration -- --runInBand --detectOpenHandles
        working-directory: cascade/modules/immobilisation
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          LOG_LEVEL: error

      - name: 📊 Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: write-integration-test-results
          path: |
            cascade/modules/immobilisation/test-results/
            cascade/modules/immobilisation/coverage/

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: E2E TESTS (avec PostgreSQL)
  # ═══════════════════════════════════════════════════════════════════════════
  e2e-tests:
    name: 🚀 E2E API Tests
    runs-on: ubuntu-latest
    needs: [write-integration-tests]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Create schema
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/001_create_schema.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: 🗄️ Run migrations
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/002_create_tables.sql
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/003_create_indexes.sql
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/infrastructure/sql/004_enable_rls.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: 🌱 Seed test data
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f cascade/modules/immobilisation/tests/e2e/sql/seed.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: 🏗️ Build module
        run: npm run build
        working-directory: cascade/modules/immobilisation

      - name: 🚀 Run E2E tests
        run: npm run test:e2e -- --coverage --forceExit
        working-directory: cascade/modules/immobilisation
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          LOG_LEVEL: error

      - name: 📊 Upload E2E coverage
        uses: codecov/codecov-action@v4
        with:
          files: cascade/modules/immobilisation/coverage/lcov.info
          flags: e2e-tests
          name: immobilisation-e2e

      - name: 📁 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            cascade/modules/immobilisation/coverage/
            cascade/modules/immobilisation/test-results/

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: CONTRACT VALIDATION
  # ═══════════════════════════════════════════════════════════════════════════
  contract-validation:
    name: 📋 Contract Validation
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📋 Validate OpenAPI spec
        run: npm run openapi:validate
        working-directory: cascade/modules/immobilisation

      - name: 🔗 Check Cost-Structure contract
        run: |
          echo "Validating Cost-Structure contract endpoints..."
          # Verify required endpoints exist in OpenAPI spec
          grep -q "IMM-CS-DEP-01" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          grep -q "IMM-CS-DEP-02" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          grep -q "IMM-CS-ALL-01" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          grep -q "IMM-CS-MNT-01" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          echo "✅ Cost-Structure contract endpoints validated"

      - name: 🔗 Check Budget contract
        run: |
          echo "Validating Budget contract endpoints..."
          # Verify required endpoints exist in OpenAPI spec
          grep -q "IMM-BUD-REN-01" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          grep -q "IMM-BUD-REN-02" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          grep -q "IMM-BUD-MNT-01" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          grep -q "IMM-BUD-DEP-01" cascade/modules/immobilisation/openapi/immobilisation.openapi.json
          echo "✅ Budget contract endpoints validated"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: SECURITY SCAN
  # ═══════════════════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🔒 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./cascade/modules/immobilisation
          extra_args: --only-verified

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6: SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests, contract-validation, security]
    if: always()
    
    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🏁 CI Results - Module Immobilisation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint & Type Check | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 E2E API Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Contract Validation | ${{ needs.contract-validation.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Contracts Validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cost-Structure (IMM-CS-*)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Budget (IMM-BUD-*)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Related Documentation" >> $GITHUB_STEP_SUMMARY
          echo "- [OpenAPI Spec](cascade/modules/immobilisation/openapi/immobilisation.openapi.json)" >> $GITHUB_STEP_SUMMARY
          echo "- [E2E Tests](cascade/modules/immobilisation/tests/e2e/)" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if any job failed
        if: |
          needs.lint.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure' ||
          needs.contract-validation.result == 'failure'
        run: |
          echo "❌ One or more required jobs failed!"
          exit 1

name: Release Gate - Final

on:
  workflow_dispatch:
  push:
    branches:
      - codex-baseline-exploitation-v2
  pull_request:
    branches:
      - main

concurrency:
  group: release-gate-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.12.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-gate:
    name: Gate final de release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        id: gate
        shell: bash
        run: |
          set -o pipefail
          npm run release:gate 2>&1 | tee release-gate.log

      - name: Summarize release gate
        if: always()
        run: |
          RELEASE_LOG_TAIL="$(tail -n 40 release-gate.log 2>/dev/null || echo 'release-gate.log non disponible')"
          {
            echo "## Release Gate Final"
            echo ""
            echo "- Commande: \`npm run release:gate\`"
            echo "- Statut: **${{ job.status }}**"
            echo "- Extrait log (40 dernières lignes):"
            echo '```text'
            echo "${RELEASE_LOG_TAIL}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
